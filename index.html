<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Melo Studio</title>
    <link rel="icon" type="image/png" href="assets/logo.png" />
    <style>
      :root {
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        padding: 32px;
        background: #ffffff;
      }

      img {
        display: block;
        width: min(680px, 88vw);
        height: auto;
      }
    </style>
  </head>
  <body>
    <img src="assets/logo.png" alt="Melo Studio" />
  </body>
</html>
