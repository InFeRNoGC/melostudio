<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Melo Studio</title>
    <link rel="icon" type="image/png" href="assets/logo.png" />
    <style>
      :root {
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        padding: 32px;
        background: #ffffff;
      }

      img {
        display: block;
        width: min(680px, 88vw);
        height: auto;
      }

      a {
        position: fixed;
        right: 24px;
        bottom: 20px;
        color: #6f747d;
        font: 14px/1.4 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        text-decoration: none;
      }

      a:hover {
        color: #1f2937;
      }
    </style>
  </head>
  <body>
    <img src="assets/logo.png" alt="Melo Studio" />
    <a href="privacy/index.html">Privacy Policy</a>
  </body>
</html>
