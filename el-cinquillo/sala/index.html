<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sala de El Cinquillo | Melo Studio</title>
    <meta
      name="description"
      content="Invitación a una sala online de El Cinquillo."
    />
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" type="image/png" href="/assets/favicon.png" />
    <style>
      :root {
        color-scheme: light;
        --yellow: #ffd33d;
        --orange: #ff7a00;
        --deep-orange: #d94300;
        --ink: #5a2200;
        --muted: #8a4512;
        --surface: #fffaf0;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(
            circle at 50% 12%,
            rgba(255, 255, 255, 0.35),
            transparent 18rem
          ),
          radial-gradient(
            circle at 50% 90%,
            rgba(90, 34, 0, 0.36),
            transparent 34rem
          ),
          linear-gradient(
            145deg,
            var(--yellow),
            var(--orange) 52%,
            var(--deep-orange)
          );
        color: var(--ink);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      main {
        width: min(440px, 100%);
        padding: 24px;
        border: 3px solid #ffc324;
        border-radius: 14px;
        background: var(--surface);
        box-shadow: 0 18px 45px rgba(90, 34, 0, 0.28);
        text-align: center;
      }

      img {
        width: 112px;
        height: 112px;
        object-fit: contain;
      }

      h1 {
        margin: 12px 0 8px;
        font-size: 2rem;
        line-height: 1.05;
      }

      p {
        margin: 0 auto 18px;
        color: var(--muted);
        font-weight: 750;
        line-height: 1.45;
      }

      .code {
        width: 100%;
        margin: 16px 0;
        padding: 16px;
        border: 2px dashed #ff8a00;
        border-radius: 10px;
        background: #ffffff;
        font-size: 2.15rem;
        font-weight: 950;
        letter-spacing: 0.12em;
      }

      .actions {
        display: grid;
        gap: 10px;
      }

      a,
      button {
        display: block;
        width: 100%;
        min-height: 50px;
        border: 0;
        border-radius: 8px;
        background: linear-gradient(135deg, #fffdf3, #ffdf7b);
        color: #6b2600;
        cursor: pointer;
        font: inherit;
        font-weight: 900;
        text-decoration: none;
        padding: 14px 16px;
      }

      a span {
        display: block;
        font-size: 0.82rem;
        font-weight: 850;
        opacity: 0.92;
        margin-top: 3px;
      }

      .primary {
        background: linear-gradient(135deg, #ffd33d, #ff8a00);
        color: #ffffff;
        text-shadow: 0 1px 2px rgba(90, 34, 0, 0.38);
      }

      .hint {
        margin-top: 14px;
        font-size: 0.92rem;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/assets/logo.webp" alt="Melo Studio" />
      <h1>El Cinquillo</h1>
      <p id="invite-copy">Te han invitado a una sala privada.</p>
      <div class="code" id="room-code">------</div>
      <div class="actions">
        <a class="primary" id="open-app" href="/">
          Abrir la app
          <span>Te llevará a la sala</span>
        </a>
        <button id="copy-code" type="button">Copiar código</button>
        <a href="https://play.google.com/store/apps/details?id=com.rowair.elcinquillo">
          Instalar desde Google Play
        </a>
      </div>
      <p class="hint" id="fallback-copy">
        Si la app no se abre, copia el código y entra desde Online > Privada.
      </p>
    </main>
    <script>
      const params = new URLSearchParams(window.location.search);
      const code = (params.get("codigo") || "").trim().toUpperCase();
      const roomType = (params.get("tipo") || "privada").trim().toLowerCase();
      const codeLabel = document.getElementById("room-code");
      const openApp = document.getElementById("open-app");
      const copyButton = document.getElementById("copy-code");
      const inviteCopy = document.getElementById("invite-copy");
      const fallbackCopy = document.getElementById("fallback-copy");
      const isPublicRoom = roomType === "publica" || roomType === "public";

      inviteCopy.textContent = isPublicRoom
        ? "Te han invitado a una partida pública."
        : "Te han invitado a una sala privada.";
      fallbackCopy.textContent = isPublicRoom
        ? "Si la app no se abre, copia el código y entra desde Online > Pública."
        : "Si la app no se abre, copia el código y entra desde Online > Privada.";

      if (code) {
        codeLabel.textContent = code;
        openApp.href =
          `com.rowair.elcinquillo://room?codigo=${encodeURIComponent(code)}` +
          `&tipo=${encodeURIComponent(roomType)}`;
      }

      copyButton.addEventListener("click", async () => {
        if (!code) return;
        await navigator.clipboard.writeText(code);
        copyButton.textContent = "Código copiado";
      });
    </script>
  </body>
</html>
