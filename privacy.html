<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Privacy Policy | Melo Studio</title>
    <meta name="robots" content="noindex, follow" />
    <link rel="canonical" href="https://www.melostudio.es/privacy/" />
    <meta http-equiv="refresh" content="0; url=privacy/" />
    <link rel="icon" type="image/png" href="assets/logo.png" />
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system,
          BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #1f2937;
        background: #ffffff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: #ffffff;
      }

      main {
        width: min(760px, calc(100% - 40px));
        margin: 0 auto;
        padding: 56px 0 72px;
      }

      header {
        margin-bottom: 40px;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        color: #4b5563;
        font-size: 15px;
        font-weight: 600;
        text-decoration: none;
      }

      .brand img {
        width: 44px;
        height: 44px;
        object-fit: contain;
      }

      h1 {
        margin: 32px 0 10px;
        color: #111827;
        font-size: clamp(32px, 5vw, 48px);
        line-height: 1.05;
        letter-spacing: 0;
      }

      .updated {
        margin: 0;
        color: #6b7280;
        font-size: 15px;
      }

      section {
        padding: 24px 0;
        border-top: 1px solid #e5e7eb;
      }

      h2 {
        margin: 0 0 12px;
        color: #111827;
        font-size: 21px;
        line-height: 1.25;
        letter-spacing: 0;
      }

      p,
      li {
        color: #374151;
        font-size: 16px;
        line-height: 1.7;
      }

      p {
        margin: 0 0 14px;
      }

      ul {
        margin: 0;
        padding-left: 22px;
      }

      a {
        color: #2563eb;
      }
    </style>
  </head>
  <body>
    <script>
      window.location.replace("privacy/");
    </script>
    <main id="privacy-policy"></main>

    <script>
      const spanishPolicy = {
        lang: "es",
        title: "Política de privacidad",
        updated: "Última actualización: 1 de mayo de 2026",
        intro:
          "Esta política explica cómo Melo Studio trata la información cuando visitas nuestro sitio web o usas nuestros productos.",
        sections: [
          {
            heading: "Información que recopilamos",
            body: [
              "No recopilamos información personal directamente desde este sitio web.",
              "Si una aplicación o producto de Melo Studio incluye formularios, cuentas, analíticas u otros servicios, se informará dentro de ese producto o en una política específica."
            ]
          },
          {
            heading: "Uso de la información",
            body: [
              "La información que recibamos se usa únicamente para prestar el servicio solicitado, mejorar nuestros productos, responder a consultas y mantener la seguridad del sitio o de la aplicación."
            ]
          },
          {
            heading: "Cookies y analíticas",
            body: [
              "Este sitio web no usa cookies propias para identificarte personalmente.",
              "Si en el futuro añadimos analíticas o servicios de terceros, actualizaremos esta política para explicar qué datos se tratan y con qué finalidad."
            ]
          },
          {
            heading: "Servicios de terceros",
            body: [
              "Nuestros productos pueden enlazar o integrarse con servicios de terceros. Esos servicios tienen sus propias políticas de privacidad y Melo Studio no controla sus prácticas."
            ]
          },
          {
            heading: "Conservación de datos",
            body: [
              "Conservamos la información solo durante el tiempo necesario para cumplir la finalidad para la que fue recibida, salvo que la ley exija un plazo mayor."
            ]
          },
          {
            heading: "Tus derechos",
            body: [
              "Puedes solicitar acceso, corrección o eliminación de tus datos personales cuando corresponda. Para hacerlo, contacta con nosotros usando el correo indicado al final de esta política."
            ]
          },
          {
            heading: "Cambios en esta política",
            body: [
              "Podemos actualizar esta política de privacidad ocasionalmente. La versión vigente será la publicada en esta página."
            ]
          },
          {
            heading: "Contacto",
            body: [
              "Si tienes preguntas sobre esta política de privacidad, escribe a Melo Studio en: privacy@melostudio.com."
            ]
          }
        ]
      };

      const englishPolicy = {
        lang: "en",
        title: "Privacy Policy",
        updated: "Last updated: May 1, 2026",
        intro:
          "This policy explains how Melo Studio handles information when you visit our website or use our products.",
        sections: [
          {
            heading: "Information We Collect",
            body: [
              "We do not collect personal information directly through this website.",
              "If a Melo Studio app or product includes forms, accounts, analytics, or other services, that product will provide its own notice or specific privacy policy."
            ]
          },
          {
            heading: "How We Use Information",
            body: [
              "Any information we receive is used only to provide the requested service, improve our products, respond to inquiries, and maintain the security of the website or app."
            ]
          },
          {
            heading: "Cookies and Analytics",
            body: [
              "This website does not use first-party cookies to personally identify you.",
              "If we add analytics or third-party services in the future, we will update this policy to explain what data is processed and why."
            ]
          },
          {
            heading: "Third-Party Services",
            body: [
              "Our products may link to or integrate with third-party services. Those services have their own privacy policies, and Melo Studio does not control their practices."
            ]
          },
          {
            heading: "Data Retention",
            body: [
              "We keep information only for as long as needed to fulfill the purpose for which it was received, unless a longer period is required by law."
            ]
          },
          {
            heading: "Your Rights",
            body: [
              "You may request access, correction, or deletion of your personal data where applicable. To do so, contact us using the email address listed at the end of this policy."
            ]
          },
          {
            heading: "Changes to This Policy",
            body: [
              "We may update this privacy policy from time to time. The current version will be the one published on this page."
            ]
          },
          {
            heading: "Contact",
            body: [
              "If you have questions about this privacy policy, contact Melo Studio at: privacy@melostudio.com."
            ]
          }
        ]
      };

      const policy = navigator.language.toLowerCase().startsWith("es")
        ? spanishPolicy
        : englishPolicy;

      document.documentElement.lang = policy.lang;
      document.title = `${policy.title} | Melo Studio`;

      const main = document.querySelector("#privacy-policy");
      main.innerHTML = `
        <header>
          <a class="brand" href="./">
            <img src="assets/logo.png" alt="" />
            <span>Melo Studio</span>
          </a>
          <h1>${policy.title}</h1>
          <p class="updated">${policy.updated}</p>
        </header>
        <section>
          <p>${policy.intro}</p>
        </section>
        ${policy.sections
          .map(
            (section) => `
              <section>
                <h2>${section.heading}</h2>
                ${section.body.map((paragraph) => `<p>${paragraph}</p>`).join("")}
              </section>
            `
          )
          .join("")}
      `;
    </script>
  </body>
</html>
